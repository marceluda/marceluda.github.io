# Tarjetas de la sección Red Pitaya.
# url: externa (https://...) o interna (empezando con /)
- nombre: Lock-in+PID
  descripcion: Dos amplificadores lock-in (cuadrado rápido y armónico lento), filtros PID y control de lock.
  descripcion_en: Two lock-in amplifiers (fast square and slow harmonic), PID filters and lock control.
  imagen: /img/cards/rp_lock-in_pid.png
  url: https://marceluda.github.io/rp_lock-in_pid/
  repo: https://github.com/marceluda/rp_lock-in_pid
- nombre: Lock-in+PID H
  descripcion: Lock-in armónico hasta 50 kHz, filtros PID y control de lock.
  descripcion_en: Harmonic lock-in up to 50 kHz, PID filters and lock control.
  imagen: /img/cards/rp_lock-in_pid_h.png
  url: https://marceluda.github.io/rp_lock-in_pid/Derivated/#lock-in-pid-h
  repo: https://github.com/marceluda/rp_lock-in_pid_h
- nombre: Lock-in+PID SQ
  descripcion: Versión de Lock-in+PID únicamente con el lock-in cuadrado (rápido).
  descripcion_en: Version of Lock-in+PID with only the square (fast) lock-in.
  imagen: /img/cards/rp_lock-in_pid_sq.png
  url: https://github.com/marceluda/rp_lock-in_pid_sq
  repo: https://github.com/marceluda/rp_lock-in_pid_sq
- nombre: Lock-in+PID H HF
  descripcion: Variante de Lock-in+PID H que llega hasta 1 MHz.
  descripcion_en: Variant of Lock-in+PID H that reaches 1 MHz.
  imagen: /img/cards/rp_lock-in_pid_h_hf.png
  url: https://marceluda.github.io/rp_lock-in_pid/Derivated/#lock-in-pid-h-hf
  repo: https://github.com/marceluda/rp_lock-in_pid_h_hf
- nombre: Lock-in+PID H2
  descripcion: Demoduladores lock-in con un mismo oscilador local, filtros PID y control de lock.
  descripcion_en: Lock-in demodulators sharing the same local oscillator, PID filters and lock control.
  imagen: /img/cards/rp_lock-in_pid_h2.png
  url: https://marceluda.github.io/rp_lock-in_pid/Derivated/#lock-in-pid-h2
  repo: https://github.com/marceluda/rp_lock-in_pid_h2
- nombre: Scope++
  descripcion: Osciloscopio con interfaz mejorada, generador de funciones y PID elementales.
  descripcion_en: Oscilloscope with enhanced interface, function generator and basic PIDs.
  imagen: /img/cards/rp_scope_plus.png
  url: https://github.com/marceluda/rp_scope_plus
  repo: https://github.com/marceluda/rp_scope_plus
- nombre: Dummy Simulator
  descripcion: Simulador de picos espectrales para probar barridos y lockeos.
  descripcion_en: Spectral peak simulator to test scans and locking.
  imagen: /img/cards/rp_dummy_simulator.png
  url: https://github.com/marceluda/rp_dummy_simulator
  repo: https://github.com/marceluda/rp_dummy_simulator
- nombre: Dummy System
  descripcion: Entorno para armar rápido Apps con diseño FPGA (Vivado 2015.2).
  descripcion_en: Environment to quickly build Apps with FPGA design (Vivado 2015.2).
  imagen: /img/cards/rp_dummy.png
  url: https://marceluda.github.io/rp_dummy/
  repo: https://github.com/marceluda/rp_dummy
